name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # np2_structs_pb2.py is generated, not committed, and rpcn_client/client.py
      # raises RpcnError on import without it. The unit tests reach that import
      # through matching/, so skipping this step fails collection, not a test.
      - name: Generate protobuf
        run: python -m grpc_tools.protoc -I. --python_out=src/rpcn_client np2_structs.proto

      - name: Run unit tests
        run: pytest tests/unit/ -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Job-level, because the migration step and the test step need the same
    # database values and letting them drift apart would fail confusingly. The
    # RPCN_* three are placeholders, not secrets: Settings requires them with no
    # default, so anything reaching get_settings() needs them present -- nothing
    # in this job talks to RPCN.
    env:
      RPCN_USER: ci-unused
      RPCN_PASSWORD: ci-unused
      RPCN_TOKEN: ci-unused
      RPCN_HOST: 127.0.0.1
      RPCN_PORT: "31313"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_URL: 127.0.0.1:5432
      DB_USER: tag2now
      DB_PASSWORD: tag2now
      DB_NAME: tag2now
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Start services
        run: docker compose -f compose.test.yml up -d --wait

      # Startup does not create tables, so the compose database comes up empty
      # and every test that touches it fails on a missing relation. env.py has
      # no DATABASE_URL here and falls back to build_dsn(driver="psycopg") over
      # the job env above; the driver has to be named because a bare
      # postgresql:// selects psycopg2, which is not installed.
      - name: Run migrations
        run: alembic upgrade head

      - name: Generate protobuf
        run: python -m grpc_tools.protoc -I. --python_out=src/rpcn_client np2_structs.proto

      # The rpcn-marked tests need sole use of an RPCN account, which CI cannot
      # hold: production is logged in as that user around the clock, and two
      # overlapping runs would collide with each other besides. They stay a
      # local check.
      - name: Run integration tests
        run: pytest tests/integration/ -v -m "not rpcn"

      - name: Stop services
        if: always()
        run: docker compose -f compose.test.yml down
