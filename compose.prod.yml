# Production stack on Lightsail, uploaded as the instance's compose.yml; see CLAUDE.md.
# No redis: REDIS_URL is empty in .env, so be caches in process.

# json-file never rotates by default; cap each service at 30 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  be:
    image: 864573346741.dkr.ecr.ap-northeast-2.amazonaws.com/tag2-now/be:${BE_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      FAST_API_PROFILE: prod
      SAVE_ADMIN_URL: http://save-admin:8000
      EVENT_BASELINE_PATH: /event/baseline.json
    env_file:
      - ./.env
    # rpcn runs with network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # A folder of its own: ~/backup/event also holds RPCN's database.
    volumes:
      - /home/ec2-user/backup/event-baseline:/event:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Released by tag2now-save-admin.
  save-admin:
    image: 864573346741.dkr.ecr.ap-northeast-2.amazonaws.com/tag2now/save-admin:${SAVE_ADMIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TAG2NOW_API_URL: http://be:8000
    env_file:
      - ./.env
    # Loopback only, for an SSH tunnel.
    ports:
      - "127.0.0.1:8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ec2-user, so the host CLI can write beside the backups this makes.
    user: "1000:1000"
    # Host paths: the audit log records them and the host CLI reopens them.
    volumes:
      - /home/ec2-user/rpcn-data/db:/home/ec2-user/rpcn-data/db
      - /home/ec2-user/rpcn-data/tus_data:/home/ec2-user/rpcn-data/tus_data
      - /home/ec2-user/backup/tdt:/home/ec2-user/backup/tdt

  fe:
    image: 864573346741.dkr.ecr.ap-northeast-2.amazonaws.com/tag2-now/fe:${FE_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://be:8000

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: tag2now
      POSTGRES_PASSWORD: tag2now
      POSTGRES_DB: tag2now
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tag2now"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
    driver_opts:
      device: /home/$USER/postgres-data
      o: bind
      type: none
