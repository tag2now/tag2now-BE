# Production stack for the Lightsail instance.
#
# The instance keeps its own .env.prod next to this file — it holds the RPCN
# credentials and is never committed. Release with:
#
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d
#
# There is no redis service: REDIS_URL is left empty in .env.prod, so the
# backend caches in-process (see src/shared/cache.py). That cache lives and
# dies with the be container, so a restart empties it.

# Docker's default json-file driver never rotates, so container logs grow
# until they fill the disk. Cap every service at 30 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  be:
    image: 864573346741.dkr.ecr.ap-northeast-2.amazonaws.com/tag2-now/be
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      FAST_API_PROFILE: prod
    env_file:
      - ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy

  fe:
    image: 864573346741.dkr.ecr.ap-northeast-2.amazonaws.com/tag2-now/fe
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://be:8000

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # No host port: be reaches it as postgres:5432 on the compose network.
    environment:
      POSTGRES_USER: tag2now
      POSTGRES_PASSWORD: tag2now
      POSTGRES_DB: tag2now
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tag2now"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
    driver_opts:
      # Bind mount, so the data survives `docker compose down -v`.
      # POSTGRES_DATA_DIR is set in .env.prod and the path must already exist.
      device: ${POSTGRES_DATA_DIR:?set it in .env.prod, e.g. /home/ubuntu/postgres-data}
      o: bind
      type: none
